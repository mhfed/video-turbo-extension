<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Turbo</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark" aria-hidden="true">▶▶</div>
        <div>
          <h1>Video Turbo</h1>
          <p id="site-label">Đang tìm video…</p>
        </div>
      </header>

      <section class="speed-card" aria-labelledby="speed-title">
        <div class="speed-heading">
          <span id="speed-title">Tốc độ phát</span>
          <output id="speed-output" for="speed-slider">1×</output>
        </div>
        <input id="speed-slider" type="range" min="0.25" max="16" step="0.25" value="1" aria-label="Tốc độ phát video">
        <div class="range-labels"><span>0.25×</span><span>16×</span></div>
        <div class="presets" aria-label="Tốc độ nhanh">
          <button data-speed="0.5">0.5×</button>
          <button data-speed="1">1×</button>
          <button data-speed="1.5">1.5×</button>
          <button data-speed="2">2×</button>
          <button data-speed="3">3×</button>
          <button data-speed="4">4×</button>
          <button data-speed="8">8×</button>
          <button data-speed="16">16×</button>
        </div>
      </section>

      <section class="transport" aria-label="Điều khiển video">
        <button id="back-button" class="transport-button" title="Tua lùi 10 giây"><span>↶</span><small>10s</small></button>
        <button id="play-button" class="play-button" title="Phát hoặc tạm dừng">▶</button>
        <button id="forward-button" class="transport-button" title="Tua tới 10 giây"><span>↷</span><small>10s</small></button>
      </section>

      <label class="setting">
        <span><strong>Nhớ theo website</strong><small>Tự áp dụng lần sau</small></span>
        <input id="remember-site" type="checkbox" checked>
        <i aria-hidden="true"></i>
      </label>

      <footer>
        <span><kbd>−</kbd>/<kbd>+</kbd> tốc độ 0.1×</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
